name: Offline replay dataset checks

on:
  pull_request:
    paths:
      - "scripts/replay_eval.py"
      - "scripts/test_replay_eval.py"
      - "docs/REPLAY_DATASET.md"
      - ".github/workflows/replay-dataset.yml"
  push:
    paths:
      - "scripts/replay_eval.py"
      - "scripts/test_replay_eval.py"
      - "docs/REPLAY_DATASET.md"
      - ".github/workflows/replay-dataset.yml"

jobs:
  replay-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate offline replay scoring
        run: python -m unittest discover -s scripts -p 'test_replay_eval.py' -v
