
name: Build Clash Commander APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare project
        run: |
          chmod +x gradlew
          chmod +x scripts/bootstrap_sherpa_deps.sh
          ./scripts/bootstrap_sherpa_deps.sh

      - name: Configure API keys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" >> local.properties
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> local.properties
          printf 'ROBOFLOW_API_KEY=%s\n' "$ROBOFLOW_API_KEY" >> local.properties

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Commander-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
