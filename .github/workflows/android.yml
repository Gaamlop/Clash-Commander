
name: Build Clash Commander APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test private Gemini relay
        run: node --test backend/worker.test.mjs

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Prepare project
        run: |
          chmod +x gradlew
          chmod +x scripts/bootstrap_sherpa_deps.sh
          ./scripts/bootstrap_sherpa_deps.sh

      - name: Configure SDK only (no API secrets inside APK)
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Test, lint and build APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Commander-Verification
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Commander-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
